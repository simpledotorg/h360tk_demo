services:
  grafana:
    image: simpledotorg/heart360tk-grafana:${HEART360TK_VERSION}
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_DATABASE_URL=postgres://grafana:ZDI5MGE3YmYyMTRlNGNmYThkMTYyZjk3@postgres:5432/${POSTGRES_DB}
      - GF_SECURITY_ADMIN_PASSWORD=Admin@Heart360
      # Served under a URL path prefix behind the shared edge. ROOT_URL must be
      # the public URL, not Grafana's own: %(protocol)s would resolve to http
      # and break redirects and share links behind TLS termination.
      - GF_SERVER_ROOT_URL=${H360TK_PUBLIC_SCHEME:-https}://${H360TK_PUBLIC_DOMAIN}${H360TK_BASE_PATH}/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

  postgres:
    image: simpledotorg/heart360tk-postgresql:${HEART360TK_VERSION}
    container_name: postgres
    ports:
      - 5432:5432
    restart: unless-stopped
    volumes:
      - ./.database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 80s

  file-processor:
    image: simpledotorg/heart360tk-fileprocessor:${HEART360TK_VERSION}
    container_name: file-upload-trigger
    environment:
      - H360TK_DATA_LOAD_SCRIPT=/scripts/ingest_file_h360tk.py
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./ingest_file_h360tk.py:/scripts/ingest_file_h360tk.py
      - .upload:/data:rw
    
  exporter:
    image: simpledotorg/heart360tk-exporter:${HEART360TK_VERSION}
    container_name: h360tk-exporter
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - SOURCE_KEY=${SOURCE_KEY}
      - EXPORT_CRON=${EXPORT_CRON}
      - UPLOAD_PROTOCOL=${UPLOAD_PROTOCOL}
      - UPLOAD_DEST_PATH=${UPLOAD_DEST_PATH}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - SFTP_HOST=${SFTP_HOST:-}
      - SFTP_PORT=${SFTP_PORT:-22}
      - SFTP_USER=${SFTP_USER:-}
      - SFTP_PASSWORD=${SFTP_PASSWORD:-}
      - SFTP_DEST_PATH=${SFTP_DEST_PATH:-/upload}
      - SFTP_TIMEOUT=${SFTP_TIMEOUT:-60}
    volumes:
      - .export:/export:rw

###
# For now, still taken from the base image
###
# TODO: have configuration (like users) dumped out of the container, to avoid losing it
# when reinstalling
  filebrowser:
    # Built in h360tk_grafana_core. Its entrypoint generates FileBrowser's
    # config.yaml from H360TK_BASE_PATH, because the sub-path can only be set
    # in a config file - there is no environment variable for it upstream.
    image: simpledotorg/heart360tk-filebrowser:${HEART360TK_VERSION}
    container_name: filebrowser-quantum
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .upload:/srv:rw
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=admin
      - H360TK_BASE_PATH=${H360TK_BASE_PATH}

  # Custom image: drakkan/sftpgo + Python venv; upload hook runs ingest_file_h360tk.py (see Dockerfile.sftpgo).
  sftpgo:
    build:
      context: .
      dockerfile: Dockerfile.sftpgo
      args:
        # Must match INGEST_SCRIPT in config/sftpgo-ingest.env and the ingest .py volume below.
        INGEST_SCRIPT_PATH: /scripts/ingest_file_h360tk.py
    image: h360tk-sftpgo:local
    container_name: sftpgo
    # Match ./.upload ownership on the host: set HOST_UID / HOST_GID in .env to `id -u` / `id -g`.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      - postgres
    ports:
      - "8090:8080"  # Web Admin & Client UI
      - "2022:2022"  # SFTP Service
      - "2121:2121"  # FTP control
      # FTP passive data — required for uploads from host/LAN (see ftpd env below).
      - "50000-50100:50000-50100"
    volumes:
      - ./loaddata.json:/etc/sftpgo/init/loaddata.json
      # Same host dir as file-processor:/data and filebrowser:/srv
      - .upload:/srv/sftpgo/data/webuser:rw
      # Hook config: Postgres + INGEST_SCRIPT (SFTPGo does not pass compose env into hooks).
      - ./config/sftpgo-ingest.env:/etc/sftpgo/ingest.env:ro
      # Hook + Python logs (not mixed with uploads)
      - ./logs/sftpgo-ingest:/var/log/sftpgo-ingest:rw
      - ./scripts/sftpgo_ingest_hook.sh:/usr/local/bin/sftpgo_ingest_hook.sh:ro
      - ./ingest_file_h360tk.py:/scripts/ingest_file_h360tk.py:ro
    environment:
      - SFTPGO_HTTPD__BINDINGS__0__PORT=8080
      # Serve the web admin/client under the instance prefix, matching the
      # sftp= entry in the proxy's H360TK_ROUTES. Without it SFTPGo serves its
      # web UI from the domain root and every asset 404s behind the prefix.
      - SFTPGO_HTTPD__WEB_ROOT=${H360TK_BASE_PATH}/sftp
      - SFTPGO_FTPD__BINDINGS__0__PORT=2121
      # PASV must advertise an address the *client* can open data connections to (not the container IP).
      # Set FTP_PASSIVE_IP in .env to match how users connect: 127.0.0.1 for ftp://127.0.0.1:2121 only;
      # your machine LAN IP if everyone uses ftp://<lan-ip>:2121 (works for local + LAN); public IP for internet.
      - SFTPGO_FTPD__BINDINGS__0__FORCE_PASSIVE_IP=${FTP_PASSIVE_IP:-127.0.0.1}
      - SFTPGO_FTPD__PASSIVE_PORT_RANGE__START=50000
      - SFTPGO_FTPD__PASSIVE_PORT_RANGE__END=50100
      - SFTPGO_DATA_PROVIDER__PASSWORD_VALIDATION__ADMINS__MIN_ENTROPY=0
      - SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN=true
      - SFTPGO_DEFAULT_ADMIN_CONFIGURED=1
      - SFTPGO_DEFAULT_ADMIN_USERNAME=admin
      - SFTPGO_DEFAULT_ADMIN_PASSWORD=admin
      - SFTPGO_LOADDATA_FROM=/etc/sftpgo/init/loaddata.json
      - SFTPGO_LOADDATA_MODE=1
      - SFTPGO_COMMON__ACTIONS__EXECUTE_ON=upload
      - SFTPGO_COMMON__ACTIONS__HOOK=/usr/local/bin/sftpgo_ingest_hook.sh

  # Fronts this instance under its URL path prefix (H360TK_BASE_PATH).
  # The shared edge for toolkit.hearts360.org forwards everything under that
  # prefix here unchanged; this proxy decides which service answers, so adding
  # a service to the instance never needs an edge change.
  proxy:
    # Built in h360tk_grafana_core; renders its nginx config at startup from
    # the H360TK_* variables below, so this repo ships no nginx files.
    image: simpledotorg/heart360tk-proxy:${HEART360TK_VERSION}
    container_name: h360tk-proxy
    restart: unless-stopped
    depends_on:
      - grafana
      - filebrowser
      - sftpgo
    ports:
      - "${H360TK_PROXY_PORT:-80}:80"
    environment:
      - H360TK_BASE_PATH=${H360TK_BASE_PATH}
      # <segment>=<host>:<port> per sub-route; the dashboard is served at
      # the prefix root. Routes this instance does not run are simply absent.
      - H360TK_ROUTES=upload=filebrowser:80 sftp=sftpgo:8080
